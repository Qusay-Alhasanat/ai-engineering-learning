[project]
name = "02-dataset-inspector"
version = "0.1.0"
description = "A small Python tool for inspecting dataset structure and basic data quality."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dataset-inspector = "dataset_inspector.main:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dataset_inspector"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
